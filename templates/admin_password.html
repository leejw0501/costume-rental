{% extends 'base.html' %}{% block title %}관리자 비밀번호 변경{% endblock %}{% block content %}
<div class="authwrap">
  <div class="authcard">
    <div class="authicon">🔑</div>
    <h1>비밀번호 변경</h1>
    {% if admin.must_change_password %}<div class="info">최초 로그인 보안을 위해 기본 비밀번호를 변경해야 합니다.</div>{% endif %}
    <form method="post" class="authform">
      <label>현재 비밀번호<input type="password" name="current_password" autocomplete="current-password" required></label>
      <label>새 비밀번호<input type="password" name="new_password" minlength="8" autocomplete="new-password" required><small>8자 이상</small></label>
      <label>새 비밀번호 확인<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
      <button type="submit" class="authsubmit">비밀번호 변경</button>
    </form>
  </div>
</div>
{% endblock %}
