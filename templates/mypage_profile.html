{% extends 'base.html' %}{% block title %}회원정보 수정{% endblock %}{% block content %}
<div class="memberform"><div class="pagehead"><div><h1>회원정보 수정</h1><p class="muted">주문서에는 저장된 회원정보가 자동 입력됩니다.</p></div><a class="button ghost" href="{{url_for('mypage')}}">마이페이지</a></div>
<form method="post" class="panel"><h2>기본 정보</h2><div class="formgrid"><label>이름<input name="name" value="{{member.name}}" required></label><label>연락처<input name="phone" value="{{member.phone}}" required></label><label>이메일<input type="email" name="email" value="{{member.email}}"></label><label>우편번호<input name="zipcode" value="{{member.zipcode}}"></label><label class="full">기본주소<input name="address1" value="{{member.address1}}"></label><label class="full">상세주소<input name="address2" value="{{member.address2}}"></label></div><hr><h2>비밀번호 변경</h2><p class="muted">비밀번호를 바꾸지 않으려면 아래 세 칸은 비워두세요.</p><div class="formgrid"><label>현재 비밀번호<input type="password" name="current_password"></label><label>새 비밀번호<input type="password" name="new_password" minlength="8"></label><label>새 비밀번호 확인<input type="password" name="confirm_password" minlength="8"></label></div><button class="memberprimary">회원정보 저장</button></form></div>
{% endblock %}
