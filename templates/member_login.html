{% extends 'base.html' %}{% block title %}로그인{% endblock %}{% block content %}<div class="authpage"><section class="authintro"><span class="heroeyebrow">WELCOME BACK</span><h1>다시 만나 반가워요.</h1><p>로그인하면 주문내역, 배송상태, 대여기간과 환급내역을 한곳에서 관리할 수 있습니다.</p><div class="authbenefits"><span>✓ 과거 주문 자동 연결</span><span>✓ 배송정보 자동 입력</span><span>✓ 대여·정산 상태 한눈에</span></div></section><section class="authcard modern"><span class="eyebrow">MEMBER LOGIN</span><h2>회원 로그인</h2><p>가입한 아이디와 비밀번호를 입력해주세요.</p><form class="authform" method="post"><input type="hidden" name="next" value="{{next_url}}"><label>아이디<input name="login_id" value="{{login_id}}" autocomplete="username" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" placeholder="비밀번호" required></label><button class="button primary authsubmit">로그인</button></form><div class="authlinks"><span>처음 이용하시나요?</span><a href="{{url_for('member_signup')}}">회원가입</a></div></section></div>{% endblock %}
