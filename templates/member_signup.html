{% extends 'base.html' %}{% block title %}회원가입{% endblock %}{% block content %}<div class="customerpagehead narrow"><div><span class="eyebrow">JOIN US</span><h1>회원가입</h1><p>한 번 가입하면 같은 연락처로 이용했던 비회원 주문도 자동 연결됩니다.</p></div><a class="button soft" href="{{url_for('member_login')}}">이미 회원이에요</a></div><form method="post" class="signupcard"><div class="formgrid modernform"><label>이름<input name="name" value="{{form.get('name','')}}" required></label><label>연락처<input name="phone" value="{{form.get('phone','')}}" placeholder="010-1234-5678" required></label><label>이메일 <small>선택</small><input type="email" name="email" value="{{form.get('email','')}}"></label><label>우편번호 <small>선택</small><input name="zipcode" value="{{form.get('zipcode','')}}"></label><label class="full">기본주소 <small>선택</small><input name="address1" value="{{form.get('address1','')}}"></label><label class="full">상세주소 <small>선택</small><input name="address2" value="{{form.get('address2','')}}"></label><label>비밀번호<input type="password" name="password" minlength="8" placeholder="8자 이상" required></label><label>비밀번호 확인<input type="password" name="confirm_password" minlength="8" required></label></div><div class="agreementbox clean"><h3>필수 동의</h3><label class="agree"><input type="checkbox" name="agree_terms" value="1" required><span><b>이용약관에 동의합니다.</b><a target="_blank" href="{{url_for('legal_policy',doc_type='terms')}}">내용보기</a></span></label><label class="agree"><input type="checkbox" name="agree_privacy" value="1" required><span><b>개인정보 수집 및 이용에 동의합니다.</b><a target="_blank" href="{{url_for('legal_policy',doc_type='privacy')}}">내용보기</a></span></label></div><button class="button primary signupsubmit">동의하고 회원가입</button></form>{% endblock %}
